[package]
name = "ping-tunnel-rs"
version = "0.1.0"
edition = "2024"
authors = ["FreaksOnE"]
description = "ICMP-based tunnel"
license = "MIT"
repository = "https://github.com/FreaksOnE/ping-tunnel-rs"
keywords = ["tcp", "udp", "icmp", "ping", "network", "tun", "tunnel"]
categories = ["network-programming"]
readme = "README.md"

[dependencies]
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["tracing-log", "env-filter"] }
tracing-appender = "0.2"
human-panic = "2.0"
anyhow = "1.0.104"
thiserror = "2.0.19"
clap = { version = "4.6.2", features = ["derive"] }
tokio = { version = "1.53.0", features = ["full"] }
futures = "0.3.33"

tun-rs = { version = "2.8.7", features = ["async_tokio", "async_framed"] }
bytes = "1.12.1"
socket2 = "0.6.5"
etherparse = "0.20.3"
fastrand = "2.4"
chacha20poly1305 = { version = "0.11", features = ["arrayvec", "getrandom"] }
rand = "0.10.2"
uuid = "1.24.0"
sha2 = "0.10"
hkdf = "0.12"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
incremental = false
strip = true
